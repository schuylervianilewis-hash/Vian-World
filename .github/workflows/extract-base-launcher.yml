name: Extract base launcher archive

on:
  push:
    branches:
      - Launcher-merge
    paths:
      - base-launcher.zip
      - .github/workflows/extract-base-launcher.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: Launcher-merge

      - name: Extract project into base-launcher/
        shell: bash
        run: |
          set -euo pipefail
          test -f base-launcher.zip
          test ! -e base-launcher
          mkdir -p "$RUNNER_TEMP/base-launcher-archive"
          unzip -q base-launcher.zip -d "$RUNNER_TEMP/base-launcher-archive"
          mapfile -t roots < <(find "$RUNNER_TEMP/base-launcher-archive" -mindepth 1 -maxdepth 1 -type d)
          if [ "${#roots[@]}" -ne 1 ]; then
            echo "Expected exactly one top-level project directory in the archive."
            exit 1
          fi
          mkdir -p base-launcher
          cp -a "${roots[0]}/." base-launcher/

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/extract-base-launcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base-launcher .github/workflows/extract-base-launcher.yml
          git commit -m "Extract base launcher project into base-launcher/"
          git push origin HEAD:Launcher-merge
