name: Build Vian World Android

on:
  push:
    branches:
      - main
      - integration/vian-world-launcher
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle wrapper caching
        uses: gradle/actions/setup-gradle@v4

      - name: Grant wrapper permission
        run: chmod +x ./gradlew

      - name: Run launcher and host unit tests
        run: ./gradlew :launcher:testDebugUnitTest :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Vian World debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Vian World debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vian-world-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
