name: Vian World APK Recovery Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vian-world-apk-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build debug APK (recovery pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;29.0.14206865 cmake;3.22.1

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install Firewall Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          rustup default 1.95.0
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Fetch locked Firewall Rust dependencies
        run: cargo fetch --locked --manifest-path external/tracker-control-android/wgbridge-rs/Cargo.toml

      - name: Grant wrapper permission
        run: chmod +x ./gradlew

      - name: Assemble Vian World debug APK
        timeout-minutes: 60
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Vian World debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vian-world-debug-recovery
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
