apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def supportedTargetAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
def selectedTargetAbis = (findProperty('targetAbis') ?: supportedTargetAbis.join(','))
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
if (selectedTargetAbis.isEmpty() || selectedTargetAbis.toSet().size() != selectedTargetAbis.size() ||
        selectedTargetAbis.any { !supportedTargetAbis.contains(it) }) {
    throw new GradleException("Invalid -PtargetAbis value. Use a comma-separated subset of: ${supportedTargetAbis.join(', ')}")
}
ext.targetAbis = selectedTargetAbis

def ccacheLauncher = file("$projectDir/gradle/ccache-launcher.sh").absolutePath
apply from: "$projectDir/gradle/wgbridge.gradle"

android {
    namespace = 'net.kollnig.missioncontrol'
    compileSdk = 37
    ndkVersion = wgbridgeNdkVersion

    defaultConfig {
        minSdk 23
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'
        buildConfigField "String", "DEFAULT_DOH_ENDPOINT", "\"https://dns.quad9.net/dns-query\""
        buildConfigField "String", "DEFAULT_DNS_IPV4", "\"9.9.9.9\""
        buildConfigField "String", "DEFAULT_DNS_IPV4_2", "\"149.112.112.112\""
        buildConfigField "String", "DEFAULT_DNS_IPV6", "\"2620:fe::fe\""
        buildConfigField "String", "DEFAULT_DNS_IPV6_2", "\"2620:fe::9\""
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_PLATFORM=android-22",
                        "-DCMAKE_C_COMPILER_LAUNCHER=${ccacheLauncher}",
                        "-DCMAKE_CXX_COMPILER_LAUNCHER=${ccacheLauncher}",
                        "-DWGBRIDGE_LIB_DIR=${buildDir}/rustJniLibs"
            }
        }
        ndk {
            abiFilters(*selectedTargetAbis)
        }
    }

    flavorDimensions = ["version"]
    productFlavors {
        // Preserve BuildConfig.FLAVOR and the GitHub release endpoint only.
        github {
            dimension "version"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += "$buildDir/rustJniLibs"
        }
    }
    externalNativeBuild {
        cmake { path "CMakeLists.txt" }
    }
    packagingOptions {
        resources { excludes += ['META-INF/DEPENDENCIES'] }
    }
    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
    lint {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            testLogging {
                events "failed"
                exceptionFormat "full"
                showCauses true
                showStackTraces true
            }
            jvmArgs += [
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                    '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            ]
        }
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.work:work-testing:2.11.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.google.guava:guava:33.7.2-android'
    annotationProcessor 'androidx.annotation:annotation:1.11.0'
    def lifecycle_version = '2.11.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    def glide_version = "5.0.9"
    implementation("com.github.bumptech.glide:glide:$glide_version") {
        exclude group: "com.android.support"
    }
    annotationProcessor "com.github.bumptech.glide:compiler:$glide_version"
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation 'com.maxmind.geoip2:geoip2:4.4.0'
    // ACRA remains temporarily for source compatibility; initialization and removal
    // are part of the later shared logging integration.
    implementation "ch.acra:acra-mail:5.14.2"
    implementation "ch.acra:acra-dialog:5.14.2"
    compileOnly "com.google.auto.service:auto-service-annotations:1.1.1"
    annotationProcessor "com.google.auto.service:auto-service:1.1.1"
    implementation 'org.smali:dexlib2:2.5.2'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'dnsjava:dnsjava:3.6.5'
    def camerax_version = '1.6.2'
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'com.google.zxing:core:3.5.4'
}
configurations {
    configureEach {
        exclude module: 'commons-logging'
        exclude module: 'httpclient'
    }
}
